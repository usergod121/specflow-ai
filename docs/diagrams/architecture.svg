<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="430" viewBox="0 0 1320 430" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 节点 -->
  <g>
    <rect x="20" y="140" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="95" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">① 环境</text>
    <text x="95" y="190" text-anchor="middle" font-size="11" fill="#6b7280">env.yaml · 编译命令</text>
  </g>
  <g>
    <rect x="280" y="140" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="355" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">② 上下文</text>
    <text x="355" y="190" text-anchor="middle" font-size="11" fill="#6b7280">files · changes · prompt</text>
  </g>
  <g>
    <rect x="540" y="140" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="615" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">③ 用例</text>
    <text x="615" y="190" text-anchor="middle" font-size="11" fill="#6b7280">带标签的验收清单</text>
  </g>
  <g>
    <rect x="800" y="140" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="875" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">④ 开发</text>
    <text x="875" y="190" text-anchor="middle" font-size="11" fill="#6b7280">白名单内改真项目</text>
  </g>
  <g>
    <rect x="1060" y="140" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="1135" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">⑤ 测试</text>
    <text x="1135" y="190" text-anchor="middle" font-size="11" fill="#6b7280">容器副本逐条验</text>
  </g>
  <g>
    <circle cx="1255" cy="175" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1255" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">接受</text>
  </g>

  <!-- 主线箭头 + 闸条件 -->
  <g stroke="#64748b" stroke-width="1.6" fill="#64748b">
    <line x1="170" y1="175" x2="278" y2="175" marker-end="url(#arr)"/>
    <line x1="430" y1="175" x2="538" y2="175" marker-end="url(#arr)"/>
    <line x1="690" y1="175" x2="798" y2="175" marker-end="url(#arr)"/>
    <line x1="950" y1="175" x2="1058" y2="175" marker-end="url(#arr)"/>
    <line x1="1210" y1="175" x2="1223" y2="175" marker-end="url(#arr)"/>
  </g>

  <g font-size="10.5" fill="#475569" text-anchor="middle">
    <text x="224" y="128">编译命令非空</text>
    <text x="224" y="141">且环境可构建</text>
    <text x="484" y="128">有可读文件</text>
    <text x="484" y="141">prompt 非空</text>
    <text x="744" y="128">≥1 条</text>
    <text x="744" y="141">每条有描述和标签</text>
    <text x="1004" y="134">编译通过</text>
    <text x="1216" y="128">清单无 PENDING</text>
    <text x="1216" y="141">且已提交</text>
  </g>

  <!-- ④ 自回环：编译错误回喂 -->
  <path d="M 875 140 C 875 92 957 92 957 140" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrD)"/>
  <text x="916" y="84" text-anchor="middle" font-size="10.5" fill="#b45309">编译错误原文回喂</text>

  <!-- ⑤ → ④：总结回喂 -->
  <path d="M 1135 210 L 1135 262 L 875 262 L 875 210" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrD)"/>
  <text x="1005" y="254" text-anchor="middle" font-size="10.5" fill="#b45309">总结回喂（再优化一轮）</text>

  <!-- 沙箱 -->
  <g>
    <rect x="1010" y="320" width="240" height="62" rx="10" fill="#fef9ec" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="1130" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">沙箱</text>
    <text x="1130" y="365" text-anchor="middle" font-size="10.5" fill="#b45309">项目副本 + 容器 · 非 root · 用后即毁</text>
    <line x1="1130" y1="320" x2="1130" y2="212" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrD)"/>
  </g>

  <!-- 事件流 -->
  <g>
    <rect x="470" y="320" width="260" height="62" rx="10" fill="#fef9ec" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="600" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">events.jsonl</text>
    <text x="600" y="365" text-anchor="middle" font-size="10.5" fill="#b45309">单写者 · 事件 id = 行号</text>
    <line x1="600" y1="320" x2="600" y2="212" stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrD)"/>
  </g>
</svg>
