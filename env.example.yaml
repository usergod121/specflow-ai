# 测试环境声明的一份真实的样子。
#
# 它的位置是**项目里的** .specflow/env.yaml（这份示例放在仓库根目录，供你复制）。
# 只有需要跑集成测试的项目才要写它：没写这份文件的项目照旧只能跑单元测试。
#
# 引擎拿它做的事是确定的（不需要模型参与）：
#   image/workdir  → 一个叫 app 的服务：把项目目录挂进 workdir、sleep infinity 常驻
#   dependencies.* → 原样映射成服务（容器之间用服务名互连，所以默认一个宿主端口都不开）
#   env:           → 原样注入 app 容器，同时也原样进 AI 的上下文（测试代码读它，不许硬编码）
#   init:          → 环境起来之后跑一次（在 app 容器里，逐条执行、失败即停）
#   reset:         → 每次跑测试之前跑（把数据恢复到一个已知状态）
# init/reset **不写进 compose**：它们是「环境起来之后要做的事」，不是容器长什么样。
#
# 改完这份文件之后，重新初始化一次环境（界面上点「初始化测试环境」，或 specflow env init）。

# 可选：这台机器上 docker 命令怎么调。写了它就用它，不写就按 PATH → 常见安装路径找。
# 典型场景：Docker 装在 WSL 里，Windows 侧的 PATH 上根本没有 docker.exe。
# docker:
#   command: "wsl docker"

# 必填：测试容器的镜像。项目目录会挂进去，测试就在这个容器里跑。
image: "eclipse-temurin:17"

# 可选：项目目录挂进容器的位置。必须是容器内的绝对路径；不写就是 /work。
workdir: "/work"

# 可选：被测代码要连的中间件。名字同时是容器互连用的服务名。
dependencies:
  db:
    image: "mysql:8.0"
    env:
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_DATABASE: "demo"
    # 写了健康检查，up 才会等它真的可用再往下走（没写就只等容器起来）。
    # 简写就是一条命令：
    healthcheck: "mysqladmin ping -h 127.0.0.1 -uroot -psecret"
  cache:
    image: "redis:7"
    # 完整写法可以调那四个时间参数：
    healthcheck:
      test: "redis-cli ping"
      interval: "2s"
      timeout: "3s"
      retries: "30"
      start-period: "5s"

# 可选：连接信息。测试代码只许从这些环境变量里读，不许把连接串写死在代码里。
env:
  DB_HOST: "db"
  DB_PORT: "3306"
  DB_USER: "root"
  DB_PASSWORD: "secret"
  CACHE_HOST: "cache"

# 可选：环境起来之后跑一次的命令（装依赖、建表、灌初始数据）。
#
# **真项目务必在这里把构建工具预热一遍。** 容器是干净的，第一次跑 mvn / npm ci / pip install
# 要把插件和依赖下载一遍，而这台机器到公网的带宽常常只有几十 KB/s：2026-10-04 的真项目实测里，
# 容器里第一次 `mvn` 花了 ~370 秒，直接把测试那 5 分钟的时限吃光——而同一个脚本在预热过的
# 容器里只要 4 秒。预热是跟开发阶段**并行**做的（开发要跑几分钟，测试阶段来取时早跑完了）。
init:
  - "python -m pip install --no-index -r requirements.txt"
  - "python -m app.migrate"
# Maven 工程写这两条（第二条把依赖的类路径也一并解析出来，测试脚本直接就能用）：
# init:
#   - "mvn -q -DskipTests compile"
#   - "mvn -q dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt"
# Node：init: ["npm ci"]        Go：init: ["go mod download"]        Gradle：init: ["./gradlew classes"]

# 可选：每次跑测试之前跑的命令（清数据）。
# 它不能省：上一轮留下的数据会让这一轮的断言时对时错，而那看起来像被测代码不稳定。
reset:
  - "python -m app.reset_db"
